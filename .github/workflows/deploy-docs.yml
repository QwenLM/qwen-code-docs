name: Build and Deploy Qwen Code Docs Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The build only needs the current tree; Nextra's git-based
          # "last modified" timestamps were already degraded with full
          # history (logged warnings), so depth 1 loses nothing that
          # worked before.
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ./website

      - name: Build website
        run: npm run build
        working-directory: ./website
        env:
          # Full multi-locale docs set is memory-heavy to statically export.
          # Node 22 (above) is far more memory-efficient than the previous
          # Node 18 (local full build peaks ~5.8GB); 12GB heap on the 16GB
          # runner leaves comfortable headroom for future growth.
          NODE_OPTIONS: --max-old-space-size=12288

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/out
