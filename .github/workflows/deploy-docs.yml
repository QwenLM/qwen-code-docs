name: Build and Deploy Qwen Code Docs Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest deploy matters: a push that arrives while an older
# build is still running makes that older build pure waste (~8min of
# runner time). Cancel the stale one and let the new one finish.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, ARM64, qwen-docs]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required: website/app/sitemap.ts derives every
          # entry's lastModified from `git log`, so a shallow checkout would
          # collapse those dates. blob:none keeps all commit/tree metadata
          # (which is all `git log --name-only` needs) while skipping file
          # contents, so history stays correct and the fetch stays cheap.
          fetch-depth: 0
          filter: blob:none

      - name: Check installed Node.js
        run: |
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) !== 22) process.exit(1)"

      # Persistent webpack cache (see scripts/clean-next.mjs): warm cache
      # cuts the compile phase from ~4-5min to ~1min.
      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: website/.next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('website/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('website/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ./website

      - name: Build website
        run: npm run build
        working-directory: ./website
        env:
          # Bound the heap while sharing the ECS host with other runners.
          NODE_OPTIONS: --max-old-space-size=12288

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./website/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
