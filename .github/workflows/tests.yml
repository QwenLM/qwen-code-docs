# The website's tests existed before this workflow but nothing ran them, so a
# regression they cover would still have reached main (#158 added the first
# src/ test and hit exactly that).
#
# Scoped to code paths, plus the English content tree. The original scoping
# note said content changes "can not affect a unit test"; that stopped being
# true when check-nav-coverage started asserting that every documentation
# directory under content/en has a sidebar entry. New sections arrive through
# the nightly translation PR, which is exactly the PR where nav drift is
# introduced, so that check has to run there — it costs one fast job. Other
# locales stay out: they are regenerated from English by `qwen-translator meta`
# and would only report the same gap seven more times.
name: Tests

on:
  pull_request:
    paths:
      - "website/src/**"
      - "website/scripts/**"
      - "website/content/en/**"
      - "website/package.json"
      - "website/package-lock.json"
      - "translator/src/**"
      - "translator/package.json"
      - "translator/package-lock.json"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "website/src/**"
      - "website/scripts/**"
      - "website/content/en/**"
      - "website/package.json"
      - "website/package-lock.json"
      - "translator/src/**"
      - "translator/package.json"
      - "translator/package-lock.json"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm ci`, not `npm install`: tsx is a devDependency the test script
      # needs on PATH, and a partial install is exactly how `npm test` ends up
      # reporting `sh: 1: tsx: not found`.
      - name: Install dependencies
        working-directory: ./website
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: ./website
        run: npm test

  # The translator package had 18 tests before this job existed and not one of
  # them had ever run in CI -- tests.yml only reached ./website. The filter
  # that guards a generated `_meta.ts` from taking the site down lives here.
  translator:
    name: Translator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: translator/package-lock.json

      - name: Install dependencies
        working-directory: ./translator
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: ./translator
        run: npm test
