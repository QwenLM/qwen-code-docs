name: Daily Incremental Translation

# Runs the translator's incremental `sync` once a day, then (if anything
# changed) commits the new translations to main, rebuilds the site and
# deploys it — all in one job.
#
# Prerequisites (set in repo Settings → Secrets and variables → Actions):
#   - Secret  TRANSLATE_CODING_PLAN_API_KEY : a cloud-reachable model API key
#   - Variable (optional) TRANSLATE_BASE_URL : override the API endpoint.
#     Defaults to https://coding.dashscope.aliyuncs.com/v1 when unset.
#   - Variable (optional) TRANSLATE_LANG_CONCURRENCY : languages translated
#     in parallel (default 6).
#   - Variable (optional) TRANSLATE_FILE_CONCURRENCY : files translated in
#     parallel per language (default 4). Total in-flight API calls are the
#     product of the two; lower them if the endpoint rate-limits.
#   QWEN_MODEL is still hardcoded below; change it if you switch models.
#   The incremental baseline lives in website/last-sync.json (tracked in
#   git), so each run only translates what changed upstream.
#
# Note: this job pushes to main with GITHUB_TOKEN, which by design does NOT
# trigger other workflows (e.g. deploy-docs.yml), so there is no double build.
# This job therefore builds + deploys itself.
#
# If main is a protected branch that forbids direct pushes, either allow the
# github-actions bot to bypass protection, or switch the push step to a PR.

on:
  schedule:
    # 20:00 UTC == 04:00 Asia/Shanghai (next day). Adjust as you like.
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # Needed by the failure-reporting step below, which files/updates a tracking
  # issue when a scheduled run fails.
  issues: write

concurrency:
  group: daily-translate
  cancel-in-progress: false

jobs:
  translate-and-deploy:
    runs-on: ubuntu-latest
    # Large upstream batches can spend nearly three hours translating before
    # the static site build starts.
    timeout-minutes: 360
    steps:
      # The commit and deploy steps below are gated on `main`, so a dispatch
      # on any other ref translates for hours at real API cost and then throws
      # the result away when the runner is torn down — while still reporting
      # success. Run 31074093979 lost a complete 1h53m catch-up that way.
      # Say so before the spend rather than after it (see #196).
      - name: Warn that this run cannot commit
        if: github.ref_name != 'main'
        run: |
          echo "::warning title=Translations will not be committed::This run is on '${GITHUB_REF_NAME}', not main, so the commit and deploy steps are skipped. Any translation produced is kept only as the 'translation-output' artifact on this run."
          {
            echo "### ⚠️ This run cannot commit"
            echo
            echo "Ref \`${GITHUB_REF_NAME}\` is not \`main\`, so **Commit translations to main** and **Deploy to GitHub Pages** will be skipped."
            echo
            echo "Any translated content is uploaded as the \`translation-output\` artifact instead — download it from this run if you need the work."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout workflow ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build translator (dist is gitignored)
        working-directory: ./translator
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install website dependencies
        working-directory: ./website
        run: npm ci --no-audit --no-fund

      - name: Run incremental translation sync
        working-directory: ./website
        env:
          OPENAI_API_KEY: ${{ secrets.TRANSLATE_CODING_PLAN_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.TRANSLATE_BASE_URL || 'https://coding.dashscope.aliyuncs.com/v1' }}
          QWEN_MODEL: qwen3.7-plus
          # Keep each response moderate; larger docs auto-chunk from this cap.
          QWEN_MAX_TOKENS: "32768"
          # Total in-flight API calls = QWEN_TRANSLATION_CONCURRENCY ×
          # QWEN_FILE_CONCURRENCY. Both are repo variables so they can be
          # tuned in Settings → Variables without a code change; defaults
          # below apply when unset. Tune down if the endpoint rate-limits.
          QWEN_TRANSLATION_CONCURRENCY: ${{ vars.TRANSLATE_LANG_CONCURRENCY || '6' }}
          QWEN_FILE_CONCURRENCY: ${{ vars.TRANSLATE_FILE_CONCURRENCY || '4' }}
          QWEN_API_MAX_RETRIES: "6"
          QWEN_CHUNK_CHARS: "12000"
        run: |
          set -o pipefail
          node ../translator/bin/qwen-translator sync 2>&1 | tee /tmp/sync.log
          # Fail the run if any file failed to translate, so we never commit a
          # baseline that skips broken files (sync advances last-sync.json even
          # on per-file failures). A failed run leaves main untouched and the
          # next run retries from the same baseline.
          if grep -qE '翻译完成: [0-9]+ 成功, [1-9][0-9]* 失败' /tmp/sync.log; then
            echo "::error::Some files failed to translate; not committing."
            exit 1
          fi

      - name: Detect changes
        id: detect
        run: |
          if [ -n "$(git status --porcelain website/content website/last-sync.json website/translation-changelog.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              echo "Changes detected — will build, commit and deploy."
            else
              echo "::warning::Changes detected, but this run is on $GITHUB_REF_NAME (not main) — they will not be committed. Download the 'translation-output' artifact from this run to keep them."
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream doc changes today — nothing to do."
          fi

      # Runs after the sync has rewritten last-sync.json, so the age reported
      # here reflects this run's outcome. Catches the failure mode a
      # failure()-gated alert cannot: the job goes green but the baseline
      # never actually advanced, so the backlog keeps growing silently.
      - name: Warn if baseline is stale
        run: |
          set -euo pipefail
          TS="$(jq -r '.timestamp // empty' website/last-sync.json)"
          if [ -z "$TS" ]; then
            echo "::warning::last-sync.json has no timestamp field; cannot check baseline age."
            exit 0
          fi
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$TS" +%s) ) / 86400 ))
          echo "Baseline age: ${AGE}d (last sync: $TS)"
          if [ "$AGE" -gt 3 ]; then
            echo "::warning::last-sync.json has not advanced in ${AGE} days — the translation backlog is growing."
          fi

      - name: Build website
        if: steps.detect.outputs.changed == 'true'
        working-directory: ./website
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: npm run build

      # Runs that cannot commit would otherwise lose their translation when the
      # runner is torn down. Keep it downloadable so a dispatch used for
      # testing is recoverable rather than a total loss (#196).
      - name: Upload translations that cannot be committed
        if: steps.detect.outputs.changed == 'true' && github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: translation-output
          path: |
            website/content
            website/last-sync.json
            website/translation-changelog.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit translations to main
        if: steps.detect.outputs.changed == 'true' && github.ref_name == 'main'
        run: |
          git config user.name "qwen-docs-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/content website/last-sync.json website/translation-changelog.json
          git commit -m "docs(i18n): daily incremental translation sync [skip ci]"
          git push origin HEAD:main

      - name: Deploy to GitHub Pages
        if: steps.detect.outputs.changed == 'true' && github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/out

      # Must stay last so it observes failures from any step above.
      #
      # Scheduled failures are otherwise invisible: GitHub only emails the
      # workflow author on cron-triggered failures, and that mail is easy to
      # filter. An expired API key took down six consecutive nightly runs
      # (07-29..08-03) before anyone noticed, freezing the sync baseline at
      # 2026-07-08 while the backlog grew to ~1800 file-translations.
      #
      # Gated to `schedule` so manual workflow_dispatch debugging runs — which
      # are expected to fail while iterating — never file issues.
      - name: Report scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Daily translation sync is failing"
          BODY="Scheduled run failed: ${RUN_URL} (commit \`${GITHUB_SHA}\`)"
          # Collapse a run of consecutive failures onto one open issue: a week
          # of breakage becomes one issue with seven comments, not seven
          # issues. Closing the issue after a fix re-arms the alert.
          NUM="$(gh issue list --repo "$GITHUB_REPOSITORY" \
                   --state open --label ci-failure --search "$TITLE in:title" \
                   --json number --jq '.[0].number // empty')"
          if [ -n "$NUM" ]; then
            echo "Commenting on existing tracking issue #${NUM}"
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            echo "Filing new tracking issue"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --label ci-failure --body "$BODY"
          fi
